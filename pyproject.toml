[project]
name = "atlas-quant"
version = "0.1.0"
description = "Atlas: global quant AI research assistant (point-in-time data, models, LLM reasoning)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.1",
    "anthropic>=1.0",
    "clarabel>=0.9",
    "cvxpy>=1.5",
    "hmmlearn>=0.3.3",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandera[polars]>=0.20",
    "polars>=1.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "structlog>=24.1",
    "tenacity>=9.0",
    "typer>=0.12",
    "zstandard>=0.23",
]

[project.scripts]
atlas = "atlas.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID", "PT", "RUF", "DTZ", "S"]
ignore = ["S101"]  # asserts are fine; mypy-style invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "E501"]  # fixtures embed real CSV/API payload lines

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# PRD §5.2: scraped/unofficial market data is forbidden in production code.
"yfinance".msg = "yfinance is allowed in notebooks/ only (ToS + silent data errors). Use a licensed connector."

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["atlas", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# cvxpy ships partial annotations; treat it as untyped rather than chase its internals
module = ["cvxpy", "cvxpy.*"]
follow_imports = "skip"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["aiolimiter.*", "zstandard.*", "pandera.*", "respx.*", "hmmlearn.*", "statsmodels.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["live: hits real external APIs (requires keys); excluded from CI"]

[tool.coverage.run]
source = ["atlas"]
branch = true
