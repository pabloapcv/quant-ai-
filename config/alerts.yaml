# Alert rules (PRD §11.3), evaluated after every daily pipeline run.
#
# Every alert is written to data/alerts/<date>.jsonl. External channels are off until you
# configure them, in .env (never in this file, which is committed): ATLAS_NTFY_TOPIC_URL for
# an ntfy topic (alerts and the weekly digest; see docs/runbooks.md "Phone notifications") and
# ATLAS_SLACK_WEBHOOK_URL for a Slack incoming webhook. ntfy_topic_url below overrides .env.
cooldown_days: 7   # the same alert (rule + subject + direction) fires at most once per window
max_per_run: 10    # rate limit; the rest are logged as suppressed

channels:
  ntfy_topic_url: ""
  slack_webhook_env: ATLAS_SLACK_WEBHOOK_URL

rules:
  - name: regime_prob_cross
    kind: regime_prob_cross
    thresholds: [0.5, 0.7]       # a quadrant probability crossing either level, either way

  - name: recession_prob
    kind: recession_prob
    threshold: 0.40              # 12-month recession probability above 40%

  - name: hy_oas_jump
    kind: series_change
    series_id: US.CREDIT.HY.OAS
    days: 7
    threshold: 0.50              # pp, i.e. +50bp in a week

  - name: vix_term_inversion
    kind: ratio
    numerator: US.VOL.VIX
    denominator: US.VOL.VIX3M
    threshold: 1.0               # VIX / VIX3M above 1: front-end stress

  - name: price_move_3m
    kind: price_move
    days: 92                     # about 3 months (commodity prices are monthly averages)
    threshold: 0.20              # a rise or fall of 20% or more
    series:
      CMDTY.OIL.BRENT: Crude oil (Brent)
      CMDTY.GAS.US: Natural gas (US)
      CMDTY.GAS.EU: Natural gas (Europe)
      CMDTY.COPPER: Copper
      CMDTY.ALUMINUM: Aluminum
      CMDTY.WHEAT: Wheat
      CMDTY.MAIZE: Corn
      CMDTY.COFFEE: Coffee

  - name: view_flip_3m
    kind: view_flip
    horizon: 3
    include_neutral: false       # only overweight <-> underweight flips

  - name: data_quality
    kind: pipeline_failure

  - name: live_ic_drift
    kind: live_ic_drift
    window: 6                    # last 6 scored live months per universe/horizon
    sigmas: 2.0                  # flag live mean IC below backtest mean - 2 standard errors

  - name: cb_decision
    kind: cb_decision
    days: 3                      # statements published in the last 3 days
    include_holds: false         # only rate changes (set true to hear about holds too)
